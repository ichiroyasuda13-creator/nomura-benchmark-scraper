name: Daily Data Sync & Cache Update

on:
  schedule:
    # Every day at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * *'
  workflow_dispatch:

# Required for the bot to push the appended snapshots back to main.
# Without this the default GITHUB_TOKEN is read-only and `git push` 403s.
permissions:
  contents: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Append daily fund snapshots
        env:
          PYTHONPATH: "."
        run: |
          python scripts/daily_snapshot.py

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Only the timeseries accrues day to day. benchmarks.json is produced
          # by the extraction pipeline and must not be clobbered here.
          git add data/timeseries/
          git diff --staged --quiet || (git commit -m "chore(data): append daily fund snapshots [skip ci]" && git push)
