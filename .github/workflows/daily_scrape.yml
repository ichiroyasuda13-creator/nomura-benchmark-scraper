name: Daily Data Sync & Cache Update

on:
  schedule:
    # Every day at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preload and sync verified benchmarks
        env:
          PYTHONPATH: "."
        run: |
          python scripts/generate_preloaded_data.py

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update verified benchmark data [skip ci]" && git push)
